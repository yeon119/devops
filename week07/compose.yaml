services:
  web:
    build: .
    ports:
      - "8080:5000"
    environment:
      APP_TITLE: "방명록"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "devops1234"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server",
      "--requirepass", "devops1234",
      "--appendonly", "yes"]
    volumes:
      - redis-data:/data

volumes:
  redis-data:

